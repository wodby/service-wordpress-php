name: wordpress-php
type: service
from: php
guidance: GUIDANCE.md
fromVersionConstraint: "^3.0.0"
fromVersion: "3.4.6"
title: PHP (WordPress)
labels:
- wordpress

options:
- version: '8.5'
  default: true
  tag: 8.5-r22
  digest: sha256:5c4d93ab66aa64169f6d8aa5a88bc3a1212807c9a73328ecfaa0ed41d7b39fbe
  devTag: 8.5-dev-r22
  devDigest: sha256:355b86839185deb713704308e6dbfe32851a4d55cc5f34ac74c5aa4f88d307dd
- version: '8.4'
  tag: 8.4-r22
  digest: sha256:7331d394851339e3029605e687fa8934132e4869f787bd2f80ae2c84c4bac907
  devTag: 8.4-dev-r22
  devDigest: sha256:7180871c4544d96b85966466383b606aacbe51bea9b222c475f23a0f19376cbf
- version: '8.3'
  tag: 8.3-r22
  digest: sha256:c455b8749732af7c95f644225765b7f7dd55c022452d32aa74927d41db624c35
  devTag: 8.3-dev-r22
  devDigest: sha256:a0e19c320ac8c3e0b1819c27246d6877f05e1f491397dbed436569e351c89085
- version: '8.2'
  tag: 8.2-r22
  digest: sha256:b3664ca9b95f8da2e82d7ecd2e5e0f25f494e4b597090c8db9bb06749c63d87e
  devTag: 8.2-dev-r22
  devDigest: sha256:0265e974edd4dd09c7fab697967d348665b7de9a2384707ee3c01dd006c8ba97
links:
- name: wp-content
  title: WP content storage
  required: true
  selectors:
  - type: storage
- name: redis
  title: Redis
  env:
  - name: REDIS_PORT
    value: '{{link.port}}'
  - name: REDIS_HOST
    value: '{{link.host}}'
  - name: REDIS_PASSWORD
    value: '{{link.tokens.password}}'
    secret: true
  selectors:
  - type: datastore
    labels:
    - redis
  - type: datastore
    labels:
    - valkey

volumes:
- name: wp-content
  title: WP content
  link: wp-content
  path: /mnt/files
  shared: true
  size: 10
  import:
    owner: 82
    group: 82

cron:
- name: cron
  title: wp cron
  # WordPress core is in the web root, or in its wp subdirectory in a project that keeps wp-content apart from core.
  command: wp cron event run --due-now --path="$(test -f "${HTTP_ROOT}/wp/wp-settings.php" && echo "${HTTP_ROOT}/wp" || echo "${HTTP_ROOT}")" --url="${WODBY_PRIMARY_URL}"
  schedule: 0 0 * * *


env:
# The WordPress root, which the cron command passes to WP-CLI.
- name: HTTP_ROOT
  # Kubernetes does not expand shell variables in env values, so the root is built from the image's APP_ROOT
  # (/var/www/html) and the docroot setting.
  value: '/var/www/html/{{settings.docroot}}'
# The code is deployed as an image: wp-admin cannot install or update plugins, themes or core.
- name: WP_DISALLOW_FILE_MODS
  value: '1'
- name: WP_AUTOMATIC_UPDATER_DISABLED
  value: '1'
- name: WP_AUTH_KEY
  value: '{{wp_auth_key}}'
  secret: true
- name: WP_AUTH_SALT
  value: '{{wp_auth_salt}}'
  secret: true
- name: WP_SECURE_AUTH_KEY
  value: '{{wp_secure_auth_key}}'
  secret: true
- name: WP_SECURE_AUTH_SALT
  value: '{{wp_secure_auth_salt}}'
  secret: true
- name: WP_LOGGED_IN_KEY
  value: '{{wp_logged_in_key}}'
  secret: true
- name: WP_LOGGED_IN_SALT
  value: '{{wp_logged_in_salt}}'
  secret: true
- name: WP_NONCE_KEY
  value: '{{wp_nonce_key}}'
  secret: true
- name: WP_NONCE_SALT
  value: '{{wp_nonce_salt}}'
  secret: true
- name: WODBY2_SERVICE_INIT_ACTION
  value: init-wordpress

build:
  connect: true
  boilerplates:
  - name: vanilla
    title: Vanilla WordPress
    repo: https://github.com/wodby/wordpress-vanilla
    branch: main

settings:
- name: docroot
  title: WordPress root subdirectory
  description: Composer-based projects have WordPress under 'web' directory by default
  placeholder: path/relative/to/git/root
  default: web
  var: DOCROOT_SUBDIR

tokens:
- name: wp_auth_key
  generate:
    regex: '[0-9a-z]{64}'
- name: wp_auth_salt
  generate:
    regex: '[0-9a-z]{64}'
- name: wp_secure_auth_key
  generate:
    regex: '[0-9a-z]{64}'
- name: wp_secure_auth_salt
  generate:
    regex: '[0-9a-z]{64}'
- name: wp_logged_in_key
  generate:
    regex: '[0-9a-z]{64}'
- name: wp_logged_in_salt
  generate:
    regex: '[0-9a-z]{64}'
- name: wp_nonce_key
  generate:
    regex: '[0-9a-z]{64}'
- name: wp_nonce_salt
  generate:
    regex: '[0-9a-z]{64}'

workloads:
- name: main
  selector:
    matchLabels:
      app.kubernetes.io/instance: '{{helm.release}}'
  kind: deployment
  primary: true
  containers:
  - name: php
    image: wodby/wordpress-php
    build: true

# Parent upgrades must not enable unvalidated workspace behavior.
workspace: false
