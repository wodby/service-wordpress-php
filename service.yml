name: wordpress-php
type: service
from: php
guidance: GUIDANCE.md
fromVersionConstraint: "^3.0.0"
fromVersion: "3.4.5"
title: PHP (WordPress)
labels:
- wordpress

options:
- version: '8.5'
  default: true
  tag: 8.5-r21
  digest: sha256:8af09d8ed8eeadeb9f2d39fd9952fdce73328190b66dbc9068d21d37c2376cd0
  devTag: 8.5-dev-r21
  devDigest: sha256:dbdd672947bc9d7def6cd8b871cc6fc2d087fbb06dfd183f94b2e4d43f357184
- version: '8.4'
  tag: 8.4-r21
  digest: sha256:17eaf9292eed6b614c8e6551711682390f41629b3db81c5b051151685be523d4
  devTag: 8.4-dev-r21
  devDigest: sha256:63acab07b550b8cfd3e8d0706e9e25a6d780fe91da3c904715830a8d57e54661
- version: '8.3'
  tag: 8.3-r21
  digest: sha256:93772afe11d3f33527b0a5492301d5d245578c40d6a9f09600c4c6b3afd784bc
  devTag: 8.3-dev-r21
  devDigest: sha256:a0ace1906de43995c3cad4d914cf3b772f5b0ada3db9ec214a1c0d802debce16
- version: '8.2'
  tag: 8.2-r21
  digest: sha256:9f9ee043f2b3b3c26c5d1ddcc8ca988b1216556430f7c9dcbad36cd373cae776
  devTag: 8.2-dev-r21
  devDigest: sha256:2036e7bc1a55b6cffd2fa35b0dfc7bba0ad092e12faed4c7c7b1e24cf7b97e54
links:
- name: wp-content
  title: WP content storage
  required: true
  selectors:
  - type: storage
- name: redis
  title: Redis
  env:
  - name: REDIS_PORT
    value: '{{link.port}}'
  - name: REDIS_HOST
    value: '{{link.host}}'
  - name: REDIS_PASSWORD
    value: '{{link.tokens.password}}'
    secret: true
  selectors:
  - type: datastore
    labels:
    - redis
  - type: datastore
    labels:
    - valkey

volumes:
- name: wp-content
  title: WP content
  link: wp-content
  path: /mnt/files
  shared: true
  size: 10
  import:
    owner: 82
    group: 82

cron:
- name: cron
  title: wp cron
  # WordPress core is in the web root, or in its wp subdirectory in a project that keeps wp-content apart from core.
  command: wp cron event run --due-now --path="$(test -f "${HTTP_ROOT}/wp/wp-settings.php" && echo "${HTTP_ROOT}/wp" || echo "${HTTP_ROOT}")" --url="${WODBY_PRIMARY_URL}"
  schedule: 0 0 * * *


env:
# The WordPress root, which the cron command passes to WP-CLI.
- name: HTTP_ROOT
  # Kubernetes does not expand shell variables in env values, so the root is built from the image's APP_ROOT
  # (/var/www/html) and the docroot setting.
  value: '/var/www/html/{{settings.docroot}}'
# The code is deployed as an image: wp-admin cannot install or update plugins, themes or core.
- name: WP_DISALLOW_FILE_MODS
  value: '1'
- name: WP_AUTOMATIC_UPDATER_DISABLED
  value: '1'
- name: WP_AUTH_KEY
  value: '{{wp_auth_key}}'
  secret: true
- name: WP_AUTH_SALT
  value: '{{wp_auth_salt}}'
  secret: true
- name: WP_SECURE_AUTH_KEY
  value: '{{wp_secure_auth_key}}'
  secret: true
- name: WP_SECURE_AUTH_SALT
  value: '{{wp_secure_auth_salt}}'
  secret: true
- name: WP_LOGGED_IN_KEY
  value: '{{wp_logged_in_key}}'
  secret: true
- name: WP_LOGGED_IN_SALT
  value: '{{wp_logged_in_salt}}'
  secret: true
- name: WP_NONCE_KEY
  value: '{{wp_nonce_key}}'
  secret: true
- name: WP_NONCE_SALT
  value: '{{wp_nonce_salt}}'
  secret: true
- name: WODBY2_SERVICE_INIT_ACTION
  value: init-wordpress

build:
  connect: true
  boilerplates:
  - name: vanilla
    title: Vanilla WordPress
    repo: https://github.com/wodby/wordpress-vanilla
    branch: main

settings:
- name: docroot
  title: WordPress root subdirectory
  description: Composer-based projects have WordPress under 'web' directory by default
  placeholder: path/relative/to/git/root
  default: web
  var: DOCROOT_SUBDIR

tokens:
- name: wp_auth_key
  generate:
    regex: '[0-9a-z]{64}'
- name: wp_auth_salt
  generate:
    regex: '[0-9a-z]{64}'
- name: wp_secure_auth_key
  generate:
    regex: '[0-9a-z]{64}'
- name: wp_secure_auth_salt
  generate:
    regex: '[0-9a-z]{64}'
- name: wp_logged_in_key
  generate:
    regex: '[0-9a-z]{64}'
- name: wp_logged_in_salt
  generate:
    regex: '[0-9a-z]{64}'
- name: wp_nonce_key
  generate:
    regex: '[0-9a-z]{64}'
- name: wp_nonce_salt
  generate:
    regex: '[0-9a-z]{64}'

workloads:
- name: main
  selector:
    matchLabels:
      app.kubernetes.io/instance: '{{helm.release}}'
  kind: deployment
  primary: true
  containers:
  - name: php
    image: wodby/wordpress-php
    build: true

# Parent upgrades must not enable unvalidated workspace behavior.
workspace: false
